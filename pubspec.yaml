name: smartschool
description: SmartSchool - Student Academic Document Request with Chatbot Support
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
    
  flutter_local_notifications: ^17.2.2
  # Supabase
  supabase_flutter: ^2.0.0

  # Environment variables
  flutter_dotenv: ^5.0.2

  # Responsive & navigation
  responsive_builder: ^0.7.0
  go_router: ^13.0.0

  # State management
  provider: ^6.0.5

  # Utilities
  intl: ^0.18.0
  google_fonts: ^6.1.0

  # QR Code generation
  qr_flutter: ^4.1.0

  # Image picker
  image_picker: ^1.1.2

  # File picker
  #file_picker: ^10.3.10

  # Google ML Kit - Text Recognition / OCR
  google_mlkit_text_recognition: ^0.15.0

  # Permission handling
  permission_handler: ^11.3.1

  # Camera
  camera: ^0.11.0

  # Image manipulation
  image: ^4.0.17

  # HTTP
  http: ^1.1.0

  # URL Launcher (for downloading released documents)
  url_launcher: ^6.2.4

  # Cupertino icons
  cupertino_icons: ^1.0.8

  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/medina logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/image/